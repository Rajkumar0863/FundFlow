
services:
  postgres:
    image: postgres:16-alpine
    container_name: fundflow-postgres
    environment:
      POSTGRES_DB: fundflow
      POSTGRES_USER: fundflow
      POSTGRES_PASSWORD: fundflow_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fundflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundflow -d fundflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fundflow_pgdata:
