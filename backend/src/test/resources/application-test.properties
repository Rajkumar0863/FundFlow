spring.application.name=FundFlow-Test

spring.datasource.url=jdbc:postgresql://localhost:5433/fundflow_test
spring.datasource.username=${DB_USERNAME:fundflow}
spring.datasource.password=${DB_PASSWORD:fundflow_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

server.port=0